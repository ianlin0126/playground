<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Color Mixer!</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Chalkboard SE', 'Comic Sans MS', 'Marker Felt', cursive;
  background: #fffde7;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px env(safe-area-inset-bottom, 16px);
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  touch-action: manipulation;
}

/* ── Target section ── */
.target-section {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 8px 0;
}

.prompt-text {
  font-size: 26px;
  color: #555;
  margin-bottom: 10px;
}

.target-display {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  background: white;
  border-radius: 40px;
  padding: 10px 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}

.target-swatch {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 4px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  flex-shrink: 0;
}

.target-name {
  font-size: 32px;
  font-weight: bold;
}

/* ── Bowl section ── */
.bowl-section {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.bowl-wrap {
  position: relative;
  width: 170px;
  height: 170px;
}

.bowl {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: #e8e8e8;
  border: 7px solid white;
  box-shadow: inset 0 6px 20px rgba(0,0,0,0.1), 0 6px 20px rgba(0,0,0,0.12);
  transition: background-color 0.45s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  -webkit-transition: background-color 0.45s ease;
}

.bowl.filled {
  font-size: 0; /* hide emoji once color fills */
}

.chips-row {
  display: flex;
  gap: 10px;
  min-height: 44px;
  align-items: center;
  justify-content: center;
}

.chip {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  animation: popIn 0.28s cubic-bezier(.175,.885,.32,1.275);
  -webkit-animation: popIn 0.28s cubic-bezier(.175,.885,.32,1.275);
}

@-webkit-keyframes popIn {
  0%   { -webkit-transform: scale(0); }
  70%  { -webkit-transform: scale(1.25); }
  100% { -webkit-transform: scale(1); }
}
@keyframes popIn {
  0%   { transform: scale(0); }
  70%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.hint {
  font-size: 24px;
  color: #888;
  text-align: center;
  min-height: 32px;
  transition: opacity 0.3s;
  -webkit-transition: opacity 0.3s;
}

.hint.oops {
  color: #f57c00;
  font-weight: bold;
}

.fresh-btn {
  background: #ff9800;
  color: white;
  border: none;
  border-radius: 40px;
  padding: 12px 30px;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  min-height: 52px;
  min-width: 160px;
  font-size: 24px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, opacity 0.1s;
  -webkit-transition: -webkit-transform 0.1s, opacity 0.1s;
}
.fresh-btn:active {
  -webkit-transform: scale(0.93);
  transform: scale(0.93);
}

/* ── Paint buttons ── */
.paints-section {
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  padding-bottom: 8px;
}

.paint-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
  min-width: 80px;
}

.paint-drop {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 5px solid white;
  box-shadow: 0 5px 18px rgba(0,0,0,0.2);
  transition: transform 0.12s;
  -webkit-transition: -webkit-transform 0.12s;
  position: relative;
}

.paint-btn:active .paint-drop {
  -webkit-transform: scale(0.88);
  transform: scale(0.88);
}

.paint-btn.used .paint-drop {
  opacity: 0.45;
}

.paint-label {
  font-size: 24px;
  font-weight: bold;
  color: #555;
}

/* ── Celebration overlay ── */
.celebration {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.92);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s;
  -webkit-transition: opacity 0.35s;
  gap: 12px;
}

.celebration.show {
  opacity: 1;
  pointer-events: all;
}

.celeb-emoji {
  font-size: 90px;
  animation: bounce 0.6s ease-in-out infinite alternate;
  -webkit-animation: bounce 0.6s ease-in-out infinite alternate;
}

@-webkit-keyframes bounce {
  from { -webkit-transform: translateY(0); }
  to   { -webkit-transform: translateY(-22px); }
}
@keyframes bounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-22px); }
}

.celeb-line1 {
  font-size: 40px;
  font-weight: bold;
  color: #333;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
}

.celeb-line2 {
  font-size: 28px;
  color: #666;
}

.next-btn {
  background: linear-gradient(135deg, #43a047, #76c442);
  color: white;
  border: none;
  border-radius: 40px;
  padding: 16px 44px;
  font-size: 28px;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(0,0,0,0.18);
  margin-top: 8px;
  min-height: 64px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s;
  -webkit-transition: -webkit-transform 0.1s;
}
.next-btn:active {
  -webkit-transform: scale(0.94);
  transform: scale(0.94);
}

/* ── Confetti ── */
.confetti-piece {
  position: fixed;
  width: 13px;
  height: 13px;
  border-radius: 3px;
  pointer-events: none;
  z-index: 199;
  animation: fall linear forwards;
  -webkit-animation: fall linear forwards;
}

@-webkit-keyframes fall {
  0%   { -webkit-transform: translateY(-30px) rotate(0deg); opacity: 1; }
  100% { -webkit-transform: translateY(105vh) rotate(750deg); opacity: 0; }
}
@keyframes fall {
  0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(750deg); opacity: 0; }
}
</style>
</head>
<body>

<!-- Target -->
<div class="target-section">
  <div class="prompt-text">Can you make this color?</div>
  <div class="target-display">
    <div class="target-swatch" id="targetSwatch"></div>
    <div class="target-name" id="targetName"></div>
  </div>
</div>

<!-- Bowl -->
<div class="bowl-section">
  <div class="bowl-wrap">
    <div class="bowl" id="bowl">🥣</div>
  </div>
  <div class="chips-row" id="chipsRow"></div>
  <div class="hint" id="hint">Tap two paint colors!</div>
  <button class="fresh-btn" onclick="resetMix()">🔄 Start Fresh</button>
</div>

<!-- Paints -->
<div class="paints-section" id="paintsSection">
  <button class="paint-btn" id="btnRed"    onclick="addColor('red')"   >
    <div class="paint-drop" style="background:radial-gradient(circle at 35% 35%, #ff7961, #d32f2f);"></div>
    <span class="paint-label">Red</span>
  </button>
  <button class="paint-btn" id="btnYellow" onclick="addColor('yellow')">
    <div class="paint-drop" style="background:radial-gradient(circle at 35% 35%, #fff176, #f9a825);"></div>
    <span class="paint-label">Yellow</span>
  </button>
  <button class="paint-btn" id="btnBlue"   onclick="addColor('blue')"  >
    <div class="paint-drop" style="background:radial-gradient(circle at 35% 35%, #64b5f6, #1565c0);"></div>
    <span class="paint-label">Blue</span>
  </button>
</div>

<!-- Celebration -->
<div class="celebration" id="celebration">
  <div class="celeb-emoji" id="celebEmoji">🌟</div>
  <div class="celeb-line1" id="celebLine1">Amazing!</div>
  <div class="celeb-line2" id="celebLine2">You made Orange!</div>
  <button class="next-btn" onclick="nextChallenge()">Next Color! →</button>
</div>

<script>
(function () {
  'use strict';

  var challenges = [
    { name: 'Orange', color: '#FF6D00', mix: ['red','yellow'],  emoji: '🍊', praise: 'Amazing!',   star: '⭐' },
    { name: 'Green',  color: '#2e7d32', mix: ['blue','yellow'], emoji: '🌿', praise: 'Wonderful!', star: '🌟' },
    { name: 'Purple', color: '#7b1fa2', mix: ['red','blue'],    emoji: '🔮', praise: 'Super job!', star: '✨' },
    { name: 'Orange', color: '#FF6D00', mix: ['red','yellow'],  emoji: '🎃', praise: 'You rock!',  star: '🎉' },
    { name: 'Green',  color: '#2e7d32', mix: ['blue','yellow'], emoji: '🐢', praise: 'Brilliant!', star: '🏆' },
    { name: 'Purple', color: '#7b1fa2', mix: ['red','blue'],    emoji: '🦄', praise: 'Fantastic!', star: '🎊' },
  ];

  var colorHex = {
    red:    '#e53935',
    yellow: '#fdd835',
    blue:   '#1e88e5',
  };

  var current = 0;
  var added   = [];
  var locked  = false;

  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return [r, g, b];
  }

  function blendHex(h1, h2) {
    var c1 = hexToRgb(h1), c2 = hexToRgb(h2);
    return 'rgb(' +
      Math.round((c1[0]+c2[0])/2) + ',' +
      Math.round((c1[1]+c2[1])/2) + ',' +
      Math.round((c1[2]+c2[2])/2) + ')';
  }

  function showChallenge(idx) {
    var c = challenges[idx];
    document.getElementById('targetSwatch').style.background = c.color;
    document.getElementById('targetName').textContent  = c.name;
    document.getElementById('targetName').style.color  = c.color;
    resetMix();
  }

  function resetMix() {
    added  = [];
    locked = false;
    var bowl = document.getElementById('bowl');
    bowl.style.background = '#e8e8e8';
    bowl.textContent = '🥣';
    bowl.classList.remove('filled');
    document.getElementById('chipsRow').innerHTML = '';
    setHint('Tap two paint colors!', false);
    document.getElementById('btnRed').classList.remove('used');
    document.getElementById('btnYellow').classList.remove('used');
    document.getElementById('btnBlue').classList.remove('used');
  }

  function setHint(text, isOops) {
    var h = document.getElementById('hint');
    h.textContent = text;
    if (isOops) { h.classList.add('oops'); } else { h.classList.remove('oops'); }
  }

  function addColor(color) {
    if (locked) return;
    if (added.indexOf(color) !== -1) {
      setHint('Already added — try another!', true);
      return;
    }
    if (added.length >= 2) return;

    added.push(color);

    // mark button used
    var btnId = { red:'btnRed', yellow:'btnYellow', blue:'btnBlue' }[color];
    document.getElementById(btnId).classList.add('used');

    // add chip
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.background = colorHex[color];
    document.getElementById('chipsRow').appendChild(chip);

    // update bowl
    var bowl = document.getElementById('bowl');
    if (added.length === 1) {
      bowl.style.background = colorHex[color];
      bowl.textContent = '';
      bowl.classList.add('filled');
      setHint('Great! Pick one more color!', false);
    } else {
      bowl.style.background = blendHex(colorHex[added[0]], colorHex[added[1]]);
      checkAnswer();
    }
  }

  function checkAnswer() {
    locked = true;
    var c       = challenges[current];
    var sorted  = added.slice().sort().join(',');
    var expected = c.mix.slice().sort().join(',');

    if (sorted === expected) {
      setTimeout(showCelebration, 550);
    } else {
      setHint('Hmm, not quite — try again! 🎨', true);
      setTimeout(function () {
        added  = [];
        locked = false;
        var bowl = document.getElementById('bowl');
        bowl.style.background = '#e8e8e8';
        bowl.textContent = '🥣';
        bowl.classList.remove('filled');
        document.getElementById('chipsRow').innerHTML = '';
        document.getElementById('btnRed').classList.remove('used');
        document.getElementById('btnYellow').classList.remove('used');
        document.getElementById('btnBlue').classList.remove('used');
        setHint('Tap two paint colors!', false);
      }, 1400);
    }
  }

  function showCelebration() {
    var c = challenges[current];
    document.getElementById('celebEmoji').textContent = c.emoji;
    document.getElementById('celebLine1').textContent = c.praise;
    document.getElementById('celebLine2').textContent = 'You made ' + c.name + '!';
    document.getElementById('celebration').classList.add('show');
    launchConfetti();
  }

  function launchConfetti() {
    var colors = ['#f44336','#FF9800','#FFEB3B','#4CAF50','#2196F3','#9C27B0','#FF4081'];
    for (var i = 0; i < 35; i++) {
      (function(delay) {
        setTimeout(function() {
          var p = document.createElement('div');
          p.className = 'confetti-piece';
          p.style.left = (Math.random() * 100) + 'vw';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          var dur = (1.4 + Math.random() * 1.8).toFixed(2) + 's';
          p.style.webkitAnimationDuration = dur;
          p.style.animationDuration = dur;
          document.body.appendChild(p);
          setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 4000);
        }, delay);
      }(i * 55));
    }
  }

  function nextChallenge() {
    document.getElementById('celebration').classList.remove('show');
    current = (current + 1) % challenges.length;
    showChallenge(current);
  }

  // kick off
  showChallenge(0);
}());
</script>
</body>
</html>
