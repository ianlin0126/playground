<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Catch the Stars!</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #07072a;
  font-family: 'Chalkboard SE', 'Comic Sans MS', 'Marker Felt', cursive;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#c {
  display: block;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  cursor: grab;
}
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 14px 20px;
  padding-top: max(14px, env(safe-area-inset-top, 14px));
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}
#game-title {
  font-size: 26px;
  color: #FFE566;
  text-shadow: 0 0 10px rgba(255,229,102,.8), 0 2px 4px rgba(0,0,0,.7);
}
#score-pill {
  font-size: 28px;
  color: #fff;
  background: rgba(255,255,255,.15);
  border-radius: 999px;
  padding: 8px 22px;
  text-shadow: 0 2px 4px rgba(0,0,0,.6);
}
.pop-msg {
  position: fixed;
  pointer-events: none;
  z-index: 10;
  font-size: 36px;
  font-weight: 900;
  color: #FFE566;
  text-shadow: 0 0 14px rgba(255,229,102,.9), 0 2px 8px rgba(0,0,0,.8);
  animation: floatUp 1s ease-out forwards;
  white-space: nowrap;
}
@keyframes floatUp {
  0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
  20%  { opacity: 1; transform: translate(-50%, -60px) scale(1.25); }
  100% { opacity: 0; transform: translate(-50%, -160px) scale(0.85); }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="game-title">⭐ Catch the Stars!</span>
  <span id="score-pill">⭐ <b id="pts">0</b></span>
</div>
<script>
(function () {
  'use strict';

  var cvs   = document.getElementById('c');
  var ctx   = cvs.getContext('2d');
  var ptsEl = document.getElementById('pts');

  var W = 0, H = 0;
  var score = 0;

  /* basket */
  var basket = { x: 0, w: 110, h: 60 };

  /* arrays */
  var stars  = [];
  var sparks = [];
  var bgDots = [];

  var lastSpawn = -Infinity;
  var spawnMs   = 1400;

  var PRAISE = [
    'Wow!', 'Amazing!', 'Great catch!', 'Superstar!',
    'Awesome!', 'You rock!', 'Brilliant!', '✨ Yes!!!',
    'Spectacular!', 'Nice one!', 'So fast!', 'Keep it up!'
  ];
  var COLORS = [
    '#FFD700', '#FF6B9D', '#00E0FF',
    '#5EFF5E', '#FF9F43', '#CF6EF7', '#FF5E57'
  ];

  /* ── Resize ── */
  function resize() {
    W = cvs.width  = window.innerWidth;
    H = cvs.height = window.innerHeight;
    basket.x = W / 2;
    basket.w = Math.min(140, W * 0.28);
    bgDots = [];
    for (var i = 0; i < 110; i++) {
      bgDots.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        phase: Math.random() * Math.PI * 2,
        spd: Math.random() * 0.02 + 0.007
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── Input: drag basket ── */
  var dragging = false;

  function startDrag(cx) { dragging = true; moveBasket(cx); }
  function moveDrag(cx)  { if (dragging) moveBasket(cx); }
  function stopDrag()    { dragging = false; }

  function moveBasket(cx) {
    var half = basket.w / 2;
    basket.x = Math.max(half + 4, Math.min(W - half - 4, cx));
  }

  cvs.addEventListener('mousedown',  function (e) { startDrag(e.clientX); });
  window.addEventListener('mousemove',function (e) { moveDrag(e.clientX); });
  window.addEventListener('mouseup',  stopDrag);

  cvs.addEventListener('touchstart', function (e) {
    e.preventDefault();
    startDrag(e.touches[0].clientX);
  }, { passive: false });
  cvs.addEventListener('touchmove', function (e) {
    e.preventDefault();
    moveDrag(e.touches[0].clientX);
  }, { passive: false });
  cvs.addEventListener('touchend', stopDrag, { passive: true });

  /* keyboard */
  var keysDown = {};
  window.addEventListener('keydown', function (e) { keysDown[e.key] = true; });
  window.addEventListener('keyup',   function (e) { delete keysDown[e.key]; });

  function applyKeys() {
    var spd = 9;
    if (keysDown['ArrowLeft']  || keysDown['a'] || keysDown['A']) moveBasket(basket.x - spd);
    if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) moveBasket(basket.x + spd);
  }

  /* ── Draw 5-point star ── */
  function drawStar(x, y, outer, color) {
    var inner = outer * 0.42;
    var n     = 5;

    /* glow */
    var g = ctx.createRadialGradient(x, y, inner * 0.2, x, y, outer * 1.8);
    g.addColorStop(0, color + 'bb');
    g.addColorStop(1, color + '00');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, outer * 1.8, 0, Math.PI * 2);
    ctx.fill();

    /* body */
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var a  = (Math.PI / n) * i - Math.PI / 2;
      var r  = (i % 2 === 0) ? outer : inner;
      var px = x + Math.cos(a) * r;
      var py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    /* shine */
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    for (var j = 0; j < n * 2; j++) {
      var a2 = (Math.PI / n) * j - Math.PI / 2;
      var r2 = (j % 2 === 0) ? outer * 0.37 : inner * 0.37;
      var px2 = (x - outer * 0.1) + Math.cos(a2) * r2;
      var py2 = (y - outer * 0.1) + Math.sin(a2) * r2;
      if (j === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* ── Draw basket ── */
  function drawBasket(bx, by) {
    var w  = basket.w;
    var h  = basket.h;
    var lw = 8;

    /* rim glow */
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur  = 18;

    /* rim (top oval) */
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth   = lw;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.ellipse(bx, by, w / 2, h * 0.18, 0, 0, Math.PI * 2);
    ctx.stroke();

    /* body */
    var innerW = w * 0.55;
    ctx.strokeStyle = '#FFB830';
    ctx.lineWidth   = lw - 1;
    ctx.beginPath();
    ctx.moveTo(bx - w / 2, by);
    ctx.bezierCurveTo(
      bx - w / 2, by + h * 0.9,
      bx - innerW / 2, by + h,
      bx, by + h
    );
    ctx.moveTo(bx + w / 2, by);
    ctx.bezierCurveTo(
      bx + w / 2, by + h * 0.9,
      bx + innerW / 2, by + h,
      bx, by + h
    );
    ctx.stroke();

    /* weave lines */
    ctx.shadowBlur = 0;
    ctx.lineWidth  = 2;
    ctx.strokeStyle = 'rgba(255,200,60,0.4)';
    for (var t = 0.25; t < 1; t += 0.25) {
      var wx = w / 2 * (1 - t * 0.45);
      var wy = by + h * t;
      ctx.beginPath();
      ctx.ellipse(bx, wy, wx, h * 0.1, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  /* ── Spawn star ── */
  function spawnStar() {
    var r     = 26 + Math.random() * 20;
    var level = Math.floor(score / 50);
    var spd   = Math.min(1.2 + level * 0.22, 5) * (0.75 + Math.random() * 0.5);
    var baseX = r + 10 + Math.random() * (W - (r + 10) * 2);
    stars.push({
      x: baseX, y: -r - 5, baseX: baseX,
      r: r, spd: spd,
      color:   COLORS[Math.floor(Math.random() * COLORS.length)],
      rot:     0,
      rotSpd:  (Math.random() - 0.5) * 0.05,
      wPhase:  Math.random() * Math.PI * 2,
      wAmp:    5 + Math.random() * 16,
      wFreq:   0.013 + Math.random() * 0.018,
      alpha:   1
    });
  }

  /* ── Particle burst ── */
  function burst(x, y, color) {
    for (var i = 0; i < 24; i++) {
      var a   = (Math.PI * 2 / 24) * i + Math.random() * 0.3;
      var spd = 2.5 + Math.random() * 5.5;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 2,
        r: 2 + Math.random() * 4,
        color: color,
        life: 1
      });
    }
  }

  /* ── Praise label ── */
  function showPraise(x, y) {
    var el = document.createElement('div');
    el.className   = 'pop-msg';
    el.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    el.style.left  = x + 'px';
    el.style.top   = Math.max(80, y) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); }, { once: true });
  }

  /* ── Check catch ── */
  function checkCatch(s) {
    var basketTop = H - basket.h - 30;
    if (s.y + s.r < basketTop) return false;
    if (s.y - s.r > basketTop + basket.h) return false;
    var half = basket.w / 2 * 0.88;
    return s.x >= basket.x - half && s.x <= basket.x + half;
  }

  /* ── Main loop ── */
  function frame(ts) {
    applyKeys();

    /* sky */
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#07072a');
    sky.addColorStop(1, '#1a0530');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    /* background stars */
    for (var di = 0; di < bgDots.length; di++) {
      var d = bgDots[di];
      d.phase += d.spd;
      ctx.globalAlpha = 0.25 + Math.sin(d.phase) * 0.22;
      ctx.fillStyle   = '#fff';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* spawn */
    if (ts - lastSpawn > spawnMs) {
      spawnStar();
      lastSpawn = ts;
      var level = Math.floor(score / 50);
      spawnMs   = Math.max(500, 1400 - level * 80);
    }

    /* update falling stars */
    var alive = [];
    var basketY = H - basket.h - 30;
    for (var si = 0; si < stars.length; si++) {
      var s = stars[si];
      s.wPhase += s.wFreq;
      s.x = s.baseX + Math.sin(s.wPhase) * s.wAmp;
      s.y += s.spd;
      s.rot += s.rotSpd;

      if (checkCatch(s)) {
        score += 10;
        ptsEl.textContent = score;
        burst(s.x, s.y, s.color);
        showPraise(s.x, basketY - 20);
        continue; /* caught — don't keep */
      }

      if (s.y > H + s.r + 10) {
        continue; /* off screen — silently remove */
      }

      alive.push(s);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      drawStar(0, 0, s.r, s.color);
      ctx.restore();
    }
    stars = alive;

    /* basket */
    drawBasket(basket.x, basketY);

    /* sparks */
    var aliveSparks = [];
    for (var pi = 0; pi < sparks.length; pi++) {
      var p = sparks[pi];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.28;
      p.life -= 0.042;
      if (p.life > 0) {
        aliveSparks.push(p);
        ctx.globalAlpha = p.life;
        ctx.fillStyle   = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    sparks = aliveSparks;
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}());
</script>
</body>
</html>
